<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABHINAV PREDICTION™ - Telegram Channel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #121318;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #1e2029;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.25) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ff8c00, #ff4500);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a1c23;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #ff8c00;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subscribers {
            color: #ffaa33;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .badge {
            background: rgba(255, 140, 0, 0.1);
            border: 1px solid rgba(255, 140, 0, 0.3);
            color: #ffaa33;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: #1a1c23;
            padding: 12px 8px;
            border-radius: 14px;
            border: 1px solid #262936;
        }

        .stat-number {
            font-size: 16px;
            font-weight: 700;
            color: #ff8c00;
        }

        .stat-label {
            font-size: 11px;
            color: #9aa0a6;
            margin-top: 4px;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #ff8c00, #ff5500);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 22px;
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        .feature-box {
            background: #1a1c23;
            border-radius: 14px;
            padding: 14px;
            text-align: left;
            border-left: 4px solid #ff8c00;
        }

        .feature-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .feature-desc {
            font-size: 12px;
            color: #9aa0a6;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glow"></div>
        <div class="content">
            
            <div class="avatar-container">
                <div class="avatar">AP</div>
            </div>

            <h1>ABHINAV PREDICTION™</h1>
            <div class="subscribers">
                👥 12.8K Subscribers (Verified)
            </div>

            <div class="badges">
                <span class="badge">🏆 Expert Analyst</span>
                <span class="badge">🚀 Toss & Match</span>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">Expert</div>
                    <div class="stat-label">Insights</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">9.8 ★</div>
                    <div class="stat-label">User Rating</div>
                </div>
            </div>

            <!-- Apne Telegram Channel Ka Link Niche Replace Karein -->
            <a href="https://t.me/your_telegram_link" class="cta-btn">
                📩 Join Telegram Channel
            </a>

            <div class="feature-box">
                <div class="feature-title">✅ Pre-Match Cricket Analysis</div>
                <div class="feature-desc">Smart & research-based toss and match insights before every match.</div>
            </div>

        </div>
    </div>

</body>
  </html>
